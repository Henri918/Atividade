<!DOCTYPE html>
<html>
<head>

<title>Movimentações</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">
<link rel="stylesheet" href="static/style.css"> 
</head>

<body id="cj" class="container mt-4">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
        <a class="navbar-brand" href="/">Navbar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
            <a class="nav-link active" aria-current="page" href="/adm">Home</a>
            <a class="nav-link" href="/movimentacos">movimentação</a>
            <a class="nav-link" href="/usuarios">Usuarios</a>
            </div>
        </div>
        </div>
    </nav>
    

<h2 style="color:white">Usuarios</h2>

<table class="table table-striped">

<thead class="table-dark">

<tr>

<th>Email</th>
<th>Tipo</th>

</tr>

</thead>

<tbody>

{% for usuario in usuarios %}

<tr>

<td>{{ usuario[1] }}</td>
<td>{{ usuario[2] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</td>

<hr>

<h3 style="color:white">Adicionar Usuário</h3>

<form action="/cadastrarusuario" method="POST">

    <div class="mb-3">

        <label style="color:white">Email</label>

        <input
        type="email"
        name="email"
        class="form-control"
        required>

    </div>

    <div class="mb-3">

        <label style="color:white">Senha</label>

        <input
        type="password"
        name="senha"
        class="form-control"
        required>

    </div>

    <div class="mb-3">

        <label style="color:white">Tipo</label>

        <select
        name="tipo"
        class="form-control">

            <option value="usuario">Usuário</option>
            <option value="admin">Administrador</option>

        </select>

    </div>

    <button
    type="submit"
    class="btn btn-success">

        Cadastrar

    </button>

</form>

</body>
</html>
